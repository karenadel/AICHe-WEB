<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — AICHE Cairo</title>

  <link rel="stylesheet" href="../../css/global/variables.css">
  <link rel="stylesheet" href="../../css/global/reset.css">
  <link rel="stylesheet" href="../../css/global/typography.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/buttons.css">
  <link rel="stylesheet" href="../../css/components/cards.css">
  <link rel="stylesheet" href="../../css/components/admin-layout.css">
  <link rel="stylesheet" href="../../css/pages/admin/dashboard.css">
</head>
<body>

<div id="navbar-container"></div>

  <div class="dashboard-layout">

    <aside class="sidebar" id="managementNav">
      <h4 class="sidebar__title">Management</h4>
      <ul class="sidebar__list" id="managementList"></ul>
    </aside>

    <main class="dashboard">

      <section class="dashboard__header welcome">
        <span class="eyebrow" id="dashboardEyebrow">Committee Operations</span>
        <h1 id="dashboardTitle">Admin Dashboard</h1>
        <p>Overview of AICHE activities, users, and content.</p>
      </section>

      <section class="dashboard__stats" id="statsGrid"></section>

      <section class="dashboard__actions">
        <h3>Quick Actions</h3>
        <div class="actions-row" id="quickActions"></div>
      </section>

      <section class="dashboard__panels">
        <div class="panel">
          <h2>Recent Activity</h2>
          <div class="activity-list" id="activityList"></div>
        </div>
      </section>

    </main>
  </div>

  <footer>
    <p>© 2026 AICHE Cairo Student Chapter</p>
  </footer>

  <script src="../../js/global/main.js"></script>
  <script src="../../js/global/navbar.js"></script>
  <script src="../../js/global/admin-auth.js"></script>
  <script src="../../js/pages/admin/dashboard.js"></script>
</body>
</html>
